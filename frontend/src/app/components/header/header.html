<div class="header-container">
  <h1 class="header-title">CoffeMap</h1>
  <nav class="header-nav">
    <a routerLink="/" class="nav-link">Inicio</a>
    <a routerLink="/reservas" class="nav-link">Reservas</a>
    <a routerLink="/comentarios" class="nav-link">Reseñas</a>

    @if (authService.isLoggedIn()) {
      <a routerLink="ver-pedido" class="nav-link">Ver pedido</a>
      <a routerLink="#" class="nav-link">Mis pedidos</a>
      <span class="nav-user">Hola, {{ authService.usuarioActual() }}</span>
      <button type="button" (click)="cerrarSesion()" class="nav-link nav-btn-logout">
        Cerrar sesión
      </button>
    } @else {
      <a routerLink="/login" class="nav-link">Ingresar</a>
    }
  </nav>
</div>
