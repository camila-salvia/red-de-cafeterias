<!-- Cabecera Blanca -->
<div class="header-banner bg-white py-4 d-flex justify-content-center align-items-center gap-4 shadow-sm">
  <h1 class="fw-bold m-0">Descubrí nuestros productos</h1>
  <span class="fs-1">☕</span>
</div>

<!-- Sección Beige (Menú y Filtros) -->
<div class="menu-container py-5">
  <div class="container-fluid px-4 px-md-5">
    <div class="row">
      
      <!-- Barra lateral de Filtros -->
      <div class="col-12 col-md-2 mb-4 mb-md-0 d-flex flex-row flex-md-column gap-3 justify-content-center justify-content-md-start">
        <button [class.activo]="filtroCategoria() === 'TODO'" (click)="cambiarFiltro('TODO')">VER TODO</button>
        <button [class.activo]="filtroCategoria() === 'BEBIDAS'" (click)="cambiarFiltro('BEBIDAS')">BEBIDAS</button>
        <button [class.activo]="filtroCategoria() === 'COMIDAS'" (click)="cambiarFiltro('COMIDAS')">COMIDAS</button>
      </div>

      <!-- Grilla de Productos -->
      <div class="col-12 col-md-10">
        <div class="row g-3 g-md-4 justify-content-center">
          @for (producto of productos(); track producto.id) {
            <div class="col-6 col-sm-4 col-md-4 col-lg-3 d-flex justify-content-center">
              <app-tarjeta-producto 
                [producto]="producto" 
                (agregar)="manejarAgregado($event)">
              </app-tarjeta-producto>
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</div>
